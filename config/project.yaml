# FlyPredictor: project configuration.
# Every choice that can move a result lives here or in features.yaml.
# Freezing the pre-registration = tagging the commit that holds these files (git tag prereg-v1).
# Section numbers refer to docs/plan_of_record.md.

project:
  name: FlyPredictor
  package: flypredictor
  plan_version: 2            # plan of record, revised 2026-10-09

# ---------------------------------------------------------------------------
# Data sources (plan section 3.1). Everything is pinned to an exact commit so a
# re-download produces byte-identical files (checked against data/manifests/).
# The V-Dem v16 Full+Others country-year file is taken from the ERT package
# data, which is the exact V-Dem release ERT v16 was built from.
# ---------------------------------------------------------------------------
sources:
  ert:
    repo: vdeminstitute/ERT
    commit: 7fd51ce856a054582820bb0ac0ccae85371ff9be   # ERT 16.0, 2026-03-31
    files:
      ert_csv: inst/ert.csv
      vdem_rdata: data/vdem.RData
      ert_codebook: inst/ERT_codebook_v16.pdf
  vdem:
    version: "16"
    note: "Taken from the ERT v16 package data (vdem.RData); V-Dem v16 Full+Others, 28,092 x 4,618"
  vdem_v10:
    version: "10"
    note: "Vintage test only (plan 10.2). Download added in a later zip."

# How the V-Dem .RData file is converted to Parquet.
#   auto    = try pyreadr, fall back to R (R/convert_vdem.R)
#   python  = pyreadr only
#   r       = R only
rdata_conversion: auto

# Path to Rscript. null = find it automatically (PATH, then C:/Program Files/R/*/bin).
rscript: null

# ---------------------------------------------------------------------------
# Sample and timing (plan sections 3 and 7)
# ---------------------------------------------------------------------------
years:
  first: 1900
  last: 2025                 # last year in V-Dem v16 / ERT v16

democracy:
  regime_var: v2x_regime     # Regimes of the World, observed at year t
  min_regime: 2              # 2 = electoral democracy, 3 = liberal democracy
  # Also require ERT's own regime type (reg_type == 1) at t. ERT decides whether an episode
  # starts in a democracy with reg_type, not with RoW; a RoW democracy that ERT treats as an
  # autocracy (e.g. Argentina 1974-75, Ghana 1980, Fiji 2003-05, Madagascar 2008) can never
  # produce a democratic episode or breakdown, so its coups would be labelled 0.
  # 45 RoW-democracy rows are affected (decision D-15). false = plan-v2 behaviour (RoW only).
  require_ert_democracy: true

ert:
  # ERT default parameters (codebook v16). Used for the shipped labels and for
  # the real-time confirmation rule (plan 3.3).
  defaults:
    start_incl: 0.01
    cum_incl: 0.10
    year_turn: 0.03
    cum_turn: 0.10
    tolerance: 5
  # Threshold sensitivity (plan 10.5); run through R/ert_variants.R after the lock.
  variants:
    strict: {start_incl: 0.01, cum_incl: 0.15, year_turn: 0.03, cum_turn: 0.10, tolerance: 5}
    loose:  {start_incl: 0.01, cum_incl: 0.07, year_turn: 0.03, cum_turn: 0.10, tolerance: 5}
  # Real-time episode status (plan 3.3): ERT's get_eps is re-run on V-Dem truncated
  # at each year T (codingend capped at T), which gives every country's episode
  # status exactly as ERT would have coded it in year T. About 5 s per year.
  realtime_years: [1900, 2025]          # inclusive range of truncation years

labels:
  # Where each country-year's state (stage 1 at risk / stage 2 in episode / neither) comes from:
  #   ert_truncated = ERT re-run on data truncated at t (exact real-time status; needs R + ERT)  [primary]
  #   rule          = Python approximation: final episodes, "confirmed" once the EDI range since the
  #                   pre-episode year reaches cum_incl; uses final end years (slight hindsight)  [fallback]
  #   hindsight     = final ERT coding, no confirmation delay (plan v1)                             [sensitivity]
  state_source: ert_truncated
  # Stage-1 event definition. DECIDED (docs/decisions_log.md, D-07b): confirmation.
  #   confirmation = ERT first codes the country as in a democratic episode in t+1..t+k
  #                  (with ert_truncated: the real-time declaration year; with rule: the confirmation year)
  #   onset        = a final-coded democratic episode STARTS in t+1..t+k (plan v2 text)
  stage1_event: confirmation
  # Only used when stage1_event = onset: rows inside an episode that has started (final coding)
  # but is not yet known at t.  zero = keep, label 0 (plan v2 text);  drop = remove them.
  onset_unconfirmed_rows: zero
  # Also label every stage-1 row with "breakdown within k years" (real-time breakdown forecast
  # across all democracies). DECISION PENDING (docs/decisions_log.md, D-08). Costs nothing to build.
  stage1_breakdown_target: true
  # Sensitivity outcome (decision D-15): "RoW moves from democracy to autocracy within k years",
  # whether or not ERT codes it as a democratic breakdown (includes near-threshold drops such as
  # Kenya 2007 and coups that ERT files as regressed autocracy). Scored on stage-1 rows; uses the
  # stage-1 maturity buffer (the RoW change is observable the year it happens).
  stage1_row_breakdown_target: true
  # Split each real-time declaration by whether the country is still a democracy in the
  # declaration year (decision D-07b): 'declaration_dem' (gradual: recognised while democratic)
  # and 'declaration_abrupt' (recognised at or after breakdown). Used for H1b, which scores
  # the H1 models on gradual events only.
  stage1_declaration_split: true
  # Stage 2 (decision D-08): real-time stage 2 is descriptive only (148 country-years).
  # The exploratory conditional stage-2 analysis (E1-E3) uses hindsight episode membership.
  stage2_exploratory_state_source: hindsight
  horizons_stage1: [1, 2, 3, 5]
  horizons_stage1_exploratory: [10]
  horizons_stage2: [1, 2, 3]
  # Label-maturity buffers in years (plan 3.5). Origins with t + k > last_year - buffer are dropped.
  # Defaults are placeholders until notebook 03 sets them from the data.
  maturity:
    stage1: {default: 0, sensitivity: [2, 4]}   # 0 is correct for stage1_event = confirmation
    stage1_onset: {default: 7, sensitivity: [2, 4]}  # used only if stage1_event = onset (p90 start->confirm lag = 7)
    stage2: {default: 5, sensitivity: [3, 7]}

# ---------------------------------------------------------------------------
# Splits (plan 7.1). Years are FORECAST ORIGINS.
# ---------------------------------------------------------------------------
splits:
  dev_last_origin: 2004
  validation:
    first_block_start: 1970
    block_length: 5
    last_block_end: 2004
  locked:
    first_origin: 2005
    last_origin: 2024
    # Decision D-07b: refit every year with hyperparameters frozen from development.
    #   annual = for each locked origin t, train on every label known by t (see training_cutoff)
    #   frozen = one fit on origins <= first_origin - 1 - k - lag (plan v2; sensitivity)
    refit: annual
    refit_sensitivity: frozen
  # Training for a validation block / the locked run uses origins <= block_start - 1 - k
  # so that no training label window overlaps the evaluation period.
  gap_equals_horizon: true
  # Training-label cutoff for forecast origin t (validation block start or locked year):
  #   origins s with s <= t - 1 - k - lag, where lag = the event's maturity buffer
  #   (0 for declarations, 5 for ERT breakdowns: a breakdown is only known once ERT can
  #   code it as genuine). Implemented in flypredictor.eval.splits.training_cutoff.
  training_label_lag: maturity

# ---------------------------------------------------------------------------
# Evaluation and inference (plan section 8)
# ---------------------------------------------------------------------------
evaluation:
  alert_budget: 0.10          # top 10% of risk scores raise an alert
  ci_level: 0.95
  bootstrap_reps: 2000        # country-clustered bootstrap
  bootstrap_seed: 20261009
  # Persistence baseline (plan 6.1): base rate within regime subtype (v2x_regime 2 vs 3)
  # x 3-year EDI change terciles, cut points fixed on development democracy rows.
  persistence_bins: 3
  persistence_smoothing: 1.0  # pseudo-count toward the training base rate in each bin
  # Intercept updating for annual refits (decision D-18): before scoring origin t, shift every
  # model's predictions (persistence included) on the logit scale so they match the event rate
  # of the last N years of training labels known at t. 0 = off. Counters the base-rate shift
  # (development 1.1% vs locked 3.0% declarations per stage-1 year at k = 1).
  recalibration_window: 10

# ---------------------------------------------------------------------------
# Confirmatory family and tuning (decisions D-20b, D-21; pre-registration sections 2 and 7)
# ---------------------------------------------------------------------------
confirmatory:
  primary_model: ridge           # D-20b; simulated power applies to ridge
  hypotheses: [H1]               # every other hypothesis is estimation only (interval, no pass/fail)
  h1_horizons: [1, 2]            # intersection test; k = 3 and 5 are the decay curve
  alpha: 0.05
  # delta = design effect (beta = 2; 76.5% power for the k = 1 and 2 rule; D-20c), NOT a pass threshold.
  # Pass rule: 95% interval excludes the baseline on Brier skill and PR-AUC / base rate.
  mde_h1_brier_skill: 0.06
  h5_headline_k: 1

tuning:
  configs_per_class: 40          # per model class per horizon; grid for penalised logits, random search otherwise
  search: random
  gru_search_seeds: 1            # search with one seed, then re-run the best configuration with seeds.neural
  objective: log_loss

# ---------------------------------------------------------------------------
# Power simulation (plan 7.2, item 6; notebooks/0x_data/04_power.ipynb)
# ---------------------------------------------------------------------------
power:
  reps: 200                   # simulated datasets per effect size
  bootstrap_reps: 500         # per simulated dataset (2000 in the real analysis)
  effect_sizes: [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]    # beta: log-odds per SD of the planted signal (0 = mechanical only)
  target_power: 0.80
  seed: 20261010
  mechanical_beta: 0.5        # fixed effect of the 3-year EDI change (gives persistence realistic skill)
  model: ridge                # fast stand-in for the elastic net (checked in notebook 04, stand_in_check)
  ridge_C: 0.01
  enet_C: 0.1                 # fixed elastic-net settings for the stand-in check (tuned in the real analysis)
  enet_l1_ratio: 0.5

seeds:
  global: 20261009
  neural: [1, 2, 3, 4, 5]
